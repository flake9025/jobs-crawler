name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build_test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Syntax check (server)
        run: |
          for f in $(find src -name '*.js'); do
            node --check "$f"
          done

  docker_smoke:
    runs-on: ubuntu-latest
    needs: build_test
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: sophia-jobs-crawler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name sophia-jobs -p 8080:8080 \
            -e ENABLE_SCRAPERS=false \
            sophia-jobs-crawler:ci

      - name: Smoke test /api/health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/health; then
              exit 0
            fi
            sleep 3
          done
          docker logs sophia-jobs --tail 100
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f sophia-jobs || true

  docker_image:
    runs-on: ubuntu-latest
    needs: docker_smoke
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/jobs-crawler
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=1.3.0
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_nas:
    runs-on: ubuntu-latest
    needs: docker_image
    if: github.event_name != 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Notify NAS
        run: |
          curl -X POST "$NAS_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"image":"ghcr.io/${{ github.repository_owner }}/jobs-crawler:latest"}'
        env:
          NAS_WEBHOOK_URL: ${{ secrets.NAS_WEBHOOK_URL }}
